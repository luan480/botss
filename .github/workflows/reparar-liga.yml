          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Padrao nao encontrado em {path}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

