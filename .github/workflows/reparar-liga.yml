name: Reparar Liga e Interacoes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[skip repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
