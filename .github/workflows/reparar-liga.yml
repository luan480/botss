      - name: Verificar sintaxe
        run: |
          node --check commands/liga/handlers/handleIniciarCore.js
          node --check commands/promocao/promotionHandler.js
          node --check commands/promocao/statusHandler.js
          node --check commands/adm/autoResponseHandler.js
          node --check commands/liga/painelCore.js

      - name: Commit das correcoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commands .github/workflows/reparar-liga.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: reparar Liga e interacoes [skip repair]"
          git push

      - name: Remover workflow temporario
        if: success()
        run: |
          git rm .github/workflows/reparar-liga.yml || true
          git diff --cached --quiet || (git commit -m "chore: remover workflow temporario [skip repair]" && git push)
